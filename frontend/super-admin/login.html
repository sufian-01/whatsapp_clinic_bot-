<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{var t=localStorage.getItem('crm_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>Kodnexus Platform — Super Admin Login</title>
  <link rel="stylesheet" href="/admin/css/variables.css" />
  <link rel="stylesheet" href="/admin/css/base.css" />
  <link rel="stylesheet" href="/admin/css/components.css" />
  <link rel="stylesheet" href="/admin/css/views.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon" style="background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); color: #fff; width: 52px; height: 52px; font-size: 24px; border-radius: var(--radius-lg); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md);">🌐</div>
      <h1 class="login-title" style="letter-spacing: -0.5px; font-size: 22px;">KODNEXUS</h1>
      <div style="margin-top: 4px;">
        <span class="badge" style="background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 999px;">HEALTHCARE AI CLOUD</span>
      </div>
      <p class="login-subtitle" style="margin-top: 10px; font-size: 13px;">Super Admin Console • Platform administration & clinic provisioning</p>
    </div>

    <div id="alertBox" class="login-alert alert-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">Platform Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="superadmin"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="form-group" style="margin-top: 16px;">
        <label for="password" class="form-label">Platform Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; height: 42px; font-size: 14px; font-weight: 600;">
          <span id="btnText">Sign In to Platform</span>
          <span id="btnSpinner" class="spinner" style="display: none;"></span>
        </button>
      </div>
    </form>

    <div class="login-footer-hint">
      Restricted to platform super administrators. Access is cryptographically audited.
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      alertBox.textContent = '';
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const res = await fetch('/api/super-admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value,
          }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Login failed.');
        }

        localStorage.setItem('super_admin_token', data.token);
        localStorage.setItem('super_admin_user', JSON.stringify(data));
        window.location.href = '/super-admin/';
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
