services:
  postgres:
    image: postgres:15-alpine
    container_name: kodnexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_bot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telegram_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kodnexus_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Database connection to the internal postgres container service
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-telegram_bot}
      
      # Clinic Platform Settings
      CLINIC_NAME: ${CLINIC_NAME:-XYZ Clinic}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-6200126662}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Asia/Kolkata}
      
      # Authentication Credentials
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-AdminSecret2026!}
      CRM_ADMIN_USERNAME: ${CRM_ADMIN_USERNAME:-admin}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD:-admin123}
      CRM_SECRET_KEY: ${CRM_SECRET_KEY:-b22e11a2f64303493e970b55146c24f6ef1e16f731c6a28291079d3568c8577c}
      
      # AI & LLM Model Keys
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      
      # Meta WhatsApp Cloud API
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-1345059468697224}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-kodnexus_verify_2026}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-91}
      
      # Sarvam Voice AI (Optional)
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-saaras:v3}
      SARVAM_TTS_MODEL: ${SARVAM_TTS_MODEL:-bulbul:v3}
      SARVAM_TTS_SPEAKER: ${SARVAM_TTS_SPEAKER:-shubh}
      
      # Server runtime configuration
      PORT: 8000
      WORKERS: ${WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - clinic_data:/app/data
      - clinic_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  clinic_data:
    driver: local
  clinic_logs:
    driver: local
